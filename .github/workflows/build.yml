name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # unit tests, the sample game's self-test and the ERB suite (tests/erb,
  # tests/golden, tests/save: see tests/erb_suite.rs)
  # on Linux, and on macOS and Windows, which no VM here can run
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Install tmux and ghostty
        # required for these tests to actually succeed
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux ghostty
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Tests
        run: cargo test --release --no-fail-fast

  # the Android app (APK): builds both ABIs with the NDK toolchain, packages
  # the Kotlin UI, and signs with a debug key
  android:
    name: android
    runs-on: ubuntu-26.04
    env:
      KOTLIN_VERSION: "2.4.21"
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-21-jdk-headless
      - name: Install Kotlin ${{ env.KOTLIN_VERSION }}
        run: |
          cd /tmp
          curl -L -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q kotlin.zip
          sudo mv kotlinc /opt/kotlinc
          sudo ln -sf /opt/kotlinc/bin/kotlinc /usr/local/bin/kotlinc
          sudo ln -sf /opt/kotlinc/bin/kotlin /usr/local/bin/kotlin
          kotlinc -version
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Fetch NDK toolchain
        working-directory: android
        run: ./fetch-toolchain.sh
      - name: Prepare keystore
        working-directory: android
        run: echo ${{ secrets.ANDROID_APK_KEYSTORE }} | base64 -d > build.keystore
      - name: Build APK
        working-directory: android
        run: printf "$(echo ${{ secrets.ANDROID_APK_KEYSTORE_PASSWD }} | base64 -d)\n" | KEYSTORE=build.keystore ./build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: emuera-tty-android.apk
          path: android/build/erb-player.apk
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # the same steps on every runner, Windows included (Git Bash)
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # dynamically linked against glibc: for ordinary amd64 desktops and servers
          # (a pinned Ubuntu, not ubuntu-latest: the glibc it needs, 2.39, only
          # changes when we choose)
          - name: linux-amd64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            ext: ""
          # static musl program: runs on any amd64 Linux, whatever its libc
          # (the recipe from the wiki's "Other CPUs" section)
          - name: linux-amd64-static
            os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            rustflags: "-C linker=rust-lld -C link-self-contained=yes -C target-feature=+crt-static"
            ext: ""
          # 64-bit Windows (run it in Windows Terminal)
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: ""
            ext: ".exe"
          # 64-bit ARM Windows (cross-built on the x86-64 runner)
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rustflags: ""
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml selects stable with rustfmt and clippy; adding the
      # target here applies to that same toolchain
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools (for musl targets)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect the binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/emuera-tty${{ matrix.ext }} dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }}
          file dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }} || true

      - uses: actions/upload-artifact@v7
        with:
          name: emuera-tty-${{ matrix.name }}
          path: dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  package:
    needs: [build, android]
    if: always()
    name: package all binaries
    runs-on: ubuntu-26.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: emuera-tty-*
          path: artifacts
          merge-multiple: true

      - name: Create release zip
        run: |
          cd artifacts
          zip -r ../emuera-tty-all-platforms.zip .
          echo "Created zip with $(find . -type f | wc -l) files:"
          find . -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: emuera-tty-all-platforms
          path: emuera-tty-all-platforms.zip
          if-no-files-found: error
