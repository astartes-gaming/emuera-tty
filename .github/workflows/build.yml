name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # unit tests, the sample game's self-test and the ERB suite (tests/erb,
  # tests/golden, tests/save: see tests/erb_suite.rs)
  test:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Formatting
        run: cargo fmt --check
      - name: Tests
        run: cargo test --release

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # the same steps on every runner, Windows included (Git Bash)
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # dynamically linked against glibc: for ordinary amd64 desktops and servers
          # (a pinned Ubuntu, not ubuntu-latest: the glibc it needs, 2.39, only
          # changes when we choose)
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            ext: ""
          # static musl program: runs on any amd64 Linux, whatever its libc
          # (the recipe from the wiki's "Other CPUs" section)
          - name: linux-amd64-static
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: "-C linker=rust-lld -C link-self-contained=yes -C target-feature=+crt-static"
            ext: ""
          # 64-bit Windows (run it in Windows Terminal)
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: ""
            ext: ".exe"
          # 64-bit ARM Windows (cross-built on the x86-64 runner)
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rustflags: ""
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml selects stable with rustfmt and clippy; adding the
      # target here applies to that same toolchain
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect the binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/emuera-tty${{ matrix.ext }} dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }}
          file dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }} || true

      - uses: actions/upload-artifact@v7
        with:
          name: emuera-tty-${{ matrix.name }}
          path: dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error
