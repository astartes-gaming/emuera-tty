name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # unit tests, the sample game's self-test and the ERB suite (tests/erb,
  # tests/golden, tests/save: see tests/erb_suite.rs)
  # on Linux, and on macOS and Windows, which no VM here can run
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Install tmux and ghostty
        # required for these tests to actually succeed
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux ghostty
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Tests
        run: cargo test --release --no-fail-fast

  # the Android app's engine library (src/android.rs) still compiles for both
  # of its CPUs, and its file paths can't lead out of the games (the APK itself
  # needs Google's toolchain: android/build.sh, by hand)
  android:
    name: android
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Add the targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27c
          api-level: 24
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Check the engine library
        run: |
          cargo check --release --lib --target aarch64-linux-android
          cargo check --release --lib --target armv7-linux-androideabi
      - name: Paths test
        working-directory: android
        run: |
          curl -fsSLo /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          /tmp/kotlinc/bin/kotlinc -nowarn kotlin/Paths.kt tools/paths_test.kt -include-runtime -d /tmp/paths.jar
          java -cp /tmp/paths.jar io.github.astartes_gaming.emuera.Paths_testKt

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # the same steps on every runner, Windows included (Git Bash)
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # dynamically linked against glibc: for ordinary amd64 desktops and servers
          # (a pinned Ubuntu, not ubuntu-latest: the glibc it needs, 2.39, only
          # changes when we choose)
          - name: linux-amd64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            ext: ""
          # static musl program: runs on any amd64 Linux, whatever its libc
          # (the recipe from the wiki's "Other CPUs" section)
          - name: linux-amd64-static
            os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            rustflags: "-C linker=rust-lld -C link-self-contained=yes -C target-feature=+crt-static"
            ext: ""
          # 64-bit Windows (run it in Windows Terminal)
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: ""
            ext: ".exe"
          # 64-bit ARM Windows (cross-built on the x86-64 runner)
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rustflags: ""
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml selects stable with rustfmt and clippy; adding the
      # target here applies to that same toolchain
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools (for musl targets)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect the binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/emuera-tty${{ matrix.ext }} dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }}
          file dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }} || true

      - uses: actions/upload-artifact@v7
        with:
          name: emuera-tty-${{ matrix.name }}
          path: dist/emuera-tty-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  package:
    needs: build
    if: always()
    name: package all binaries
    runs-on: ubuntu-26.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: emuera-tty-*
          path: artifacts
          merge-multiple: true

      - name: Create release zip
        run: |
          cd artifacts
          zip -r ../emuera-tty-all-platforms.zip .
          echo "Created zip with $(find . -type f | wc -l) files:"
          find . -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: emuera-tty-all-platforms
          path: emuera-tty-all-platforms.zip
          if-no-files-found: error
