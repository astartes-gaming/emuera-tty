[package]
name = "emuera-tty"
version = "0.1.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2"
base64 = "0.23.1"
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "jpeg", "webp"] }
# no xattr: extended attributes aren't needed, and its rustix dependency
# doesn't build for m68k, Hexagon, C-SKY or big-endian ARM
tar = { version = "0.4", default-features = false }
unicode-width = "0.2.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# `cargo build --features profile`: EMUERA_PPROF=<file> samples where the
# interpreter spends its time (development only)
pprof = { version = "0.15", optional = true }

[features]
profile = ["dep:pprof"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Devices_Communication"] }

[profile.release]
# whole-program optimisation: the interpreter's hot paths inline across
# modules (about 10–20% faster than the default 16 codegen units)
lto = "fat"
codegen-units = 1

# development builds with release speed but a quicker compile
[profile.fastbuild]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"

[lints.clippy]
# their suggestions need a newer Rust than some systems ship (1.87+)
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
# style only: the long signatures and nested types read fine as they are
type_complexity = "allow"
too_many_arguments = "allow"
# loops whose index is used for more than indexing
needless_range_loop = "allow"
